# Rose Pine tmux layout, recolored with Vague palette.
# Vague colors mapped to rose-pine's $thm_* roles:
#   base #141415  surface/overlay #252530  muted/subtle #606079  text #cdcdcd
#   love #d8647e  gold #f3be7c  rose #e08398  pine #6e94b2  foam #aeaed1  iris #bb9dbd

set -g status on
set -g status-interval 1
set -g status-left-length 200
set -g status-right-length 200

set -g status-style "fg=#6e94b2,bg=#141415"
set -g message-style "fg=#606079,bg=#141415"
set -g message-command-style "fg=#141415,bg=#f3be7c"
set -g pane-border-style "fg=#252530"
set -g pane-active-border-style "fg=#f3be7c"
set -g display-panes-active-colour "#cdcdcd"
set -g display-panes-colour "#f3be7c"

setw -g window-status-style "fg=#bb9dbd,bg=#141415"
setw -g window-status-current-style "fg=#f3be7c,bg=#141415"
setw -g window-status-activity-style "fg=#141415,bg=#e08398"
setw -g clock-mode-colour "#d8647e"
setw -g mode-style "bg=#252530,fg=#cdcdcd"

# Left: session + active window (love when prefix is pressed)
set -g status-left "#[fg=#{?client_prefix,#d8647e,#cdcdcd}] #[fg=#cdcdcd]#S#[fg=#cdcdcd]   #[fg=#606079] #[fg=#e08398]#W#[fg=#cdcdcd]   "

# Right: current dir + date/time
set -g status-right "#[fg=#606079] #[fg=#e08398]#{b:pane_current_path}#[fg=#cdcdcd]   #[fg=#aeaed1]󰃰 %Y-%m-%d %H:%M "

setw -g window-status-separator "  "
setw -g window-status-format "#[fg=#bb9dbd]#I#[fg=#bb9dbd]  #[fg=#bb9dbd]#W"
setw -g window-status-current-format "#[fg=#f3be7c]#I#[fg=#f3be7c]  #[fg=#f3be7c]#W"
